services:
  # 1. NestJS REST API Web Service (Render Free Instance Tier)
  - type: web
    name: jeeto-api
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run prisma:generate --workspace=apps/api && npm run build --workspace=apps/api
    preDeployCommand: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
    startCommand: npm run start:prod --workspace=apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: jeeto-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 7d

# 2. Managed PostgreSQL 16 Database (Render Free Tier - 1GB Storage)
databases:
  - name: jeeto-db
    databaseName: jeeto_indian_db
    region: singapore
    plan: free
