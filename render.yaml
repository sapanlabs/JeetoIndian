services:
  # 1. NestJS REST API Web Service
  - type: web
    name: jeeto-api
    env: node
    region: singapore
    plan: starter
    buildCommand: npm install && npm run prisma:generate --workspace=apps/api && npm run build --workspace=apps/api
    preDeployCommand: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
    startCommand: npm run start:prod --workspace=apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: jeeto-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: jeeto-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: jeeto-redis
          property: port
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 7d

# 2. Managed PostgreSQL 16 Database
databases:
  - name: jeeto-db
    databaseName: jeeto_indian_db
    region: singapore
    plan: starter

# 3. Managed Redis 7 Instance
# Note: Provisioned automatically via Render Blueprint or Dashboard
